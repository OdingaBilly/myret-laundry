name: Auto Migrate on Main

on:
  push:
    branches: [ main ]

jobs:
  migrate:
    name: Run migrations on main
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: migrate-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run migrate:run
